name: Đồng bộ sang các repo vệ tinh

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  dong-bo:
    if: github.repository == 'trongdung1982/giapha-supabase'
    runs-on: ubuntu-latest
    steps:
      - name: Tải mã nguồn từ giapha-supabase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Chuẩn bị nội dung cho các repo vệ tinh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Bỏ CNAME để không xung đột tên miền nguyentrongbac.io.vn
          if [ -f CNAME ]; then
            git rm -f CNAME
          fi

          # Bỏ file workflow này ở repo đích
          if [ -f .github/workflows/dong-bo-sang-levantrac.yml ]; then
            git rm -f .github/workflows/dong-bo-sang-levantrac.yml
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Bỏ CNAME trên repo vệ tinh"
          fi

      - name: Đẩy sang các repo vệ tinh
        env:
          PAT: ${{ secrets.DONG_BO_APP_GIA_PHA_SANG_REPO_KHAC }}
        run: |
          for REPO in "LeVanTrac" "HoTrinh" "NguyenQuang"; do
            echo "--- Đang đồng bộ sang $REPO ---"
            git push --force https://x-access-token:${PAT}@github.com/trongdung1982/${REPO}.git HEAD:main
          done

