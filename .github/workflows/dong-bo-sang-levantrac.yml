name: Đồng bộ sang repo LeVanTrac

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  dong-bo:
    if: github.repository == 'trongdung1982/giapha-supabase'
    runs-on: ubuntu-latest
    steps:
      - name: Tải mã nguồn từ giapha-supabase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Chuẩn bị nội dung cho repo LeVanTrac
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Bỏ CNAME để không xung đột tên miền nguyentrongbac.io.vn
          if [ -f CNAME ]; then
            git rm -f CNAME
          fi

          # Bỏ file workflow này ở repo đích
          if [ -f .github/workflows/dong-bo-sang-levantrac.yml ]; then
            git rm -f .github/workflows/dong-bo-sang-levantrac.yml
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Bỏ CNAME trên LeVanTrac"
          fi

      - name: Đẩy sang repo LeVanTrac
        env:
          PAT: ${{ secrets.DONG_BO_APP_GIA_PHA_SANG_REPO_KHAC }}
        run: |
          git push --force https://x-access-token:${PAT}@github.com/trongdung1982/LeVanTrac.git HEAD:main
